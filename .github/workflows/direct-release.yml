name: Direct release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Info.plist]

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15.0'

      - name: Require exact checkout and release identity
        id: version
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)
          tag=$(python3 Tools/release_tag.py "$version" "$build")
          modules=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(', '.join(json.loads(Path('app.json').read_text())['modules']))
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Dispatch convergence checks for release version push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$remote_sha" = "$GITHUB_SHA"
          for workflow in linux-contracts.yml build2-macos.yml module-build-matrix.yml; do
            gh workflow run "$workflow" --ref main
          done

      - name: Await successful exact-SHA convergence
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 105); do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f head_sha="$GITHUB_SHA" -f event=workflow_dispatch -f per_page=100 \
              > "$RUNNER_TEMP/convergence-runs.json"
            state=$(python3 - "$RUNNER_TEMP/convergence-runs.json" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          runs = json.load(open(sys.argv[1], encoding="utf-8")).get("workflow_runs", [])
          sha = sys.argv[2]
          required = {"Linux contracts", "Build 2 macOS", "Module build matrix"}
          selected = {}
          for run in runs:
              name = run.get("name")
              if run.get("head_sha") != sha or run.get("event") != "workflow_dispatch" or name not in required:
                  continue
              if name not in selected or int(run.get("run_number") or 0) > int(selected[name].get("run_number") or 0):
                  selected[name] = run
          if all(name in selected and selected[name].get("conclusion") == "success" for name in required):
              print("success")
          elif any(run.get("status") == "completed" and run.get("conclusion") != "success" for run in selected.values()):
              print("failure")
          else:
              print("pending")
          PY
            )
            case "$state" in
              success) exit 0 ;;
              failure) echo "A convergence run failed; refusing release." >&2; exit 1 ;;
              pending) sleep 15 ;;
              *) echo "Unknown convergence state: $state" >&2; exit 1 ;;
            esac
          done
          echo "Timed out awaiting release convergence checks." >&2
          exit 1

      - name: Require successful convergence dispatches on exact SHA
        id: convergence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f event="workflow_dispatch" \
            -f per_page=100 \
            > "$RUNNER_TEMP/convergence-runs.json"
          python3 - "$RUNNER_TEMP/convergence-runs.json" "$GITHUB_SHA" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          path, sha, output_path = sys.argv[1:4]
          runs = json.load(open(path, encoding="utf-8")).get("workflow_runs", [])
          required = {"Linux contracts", "Build 2 macOS", "Module build matrix"}
          selected = {}
          for run in runs:
              if (
                  run.get("head_sha") != sha
                  or run.get("event") != "workflow_dispatch"
                  or run.get("conclusion") != "success"
                  or run.get("name") not in required
              ):
                  continue
              name = run["name"]
              if name not in selected or int(run.get("run_number") or 0) > int(selected[name].get("run_number") or 0):
                  selected[name] = run

          missing = sorted(required - selected.keys())
          if missing:
              raise SystemExit(
                  "Missing successful workflow_dispatch convergence run(s) for exact SHA "
                  + sha
                  + ": "
                  + ", ".join(missing)
              )

          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"build2_run_id={selected['Build 2 macOS']['id']}\n")

          for name in sorted(required):
              run = selected[name]
              print(f"{name}: {run.get('html_url')} ({run.get('head_sha')})")
          PY

      - name: Download exact convergence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="MacGamingTrainer-${{ steps.version.outputs.version }}-b${{ steps.version.outputs.build }}-${{ steps.version.outputs.sha_short }}-rc"
          mkdir -p artifacts
          gh run download "${{ steps.convergence.outputs.build2_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir artifacts

      - name: Verify retained artifact provenance and checksum
        id: package
        run: |
          test "$(find artifacts -maxdepth 1 -type f -name '*.zip' -print | wc -l | tr -d ' ')" -eq 1
          test "$(find artifacts -maxdepth 1 -type f -name '*.provenance.json' -print | wc -l | tr -d ' ')" -eq 1
          test "$(find artifacts -maxdepth 1 -type f -name '*.zip.sha256' -print | wc -l | tr -d ' ')" -eq 1
          artifact="$(find artifacts -maxdepth 1 -type f -name '*.zip' -print)"
          provenance="$(find artifacts -maxdepth 1 -type f -name '*.provenance.json' -print)"
          sidecar="$(find artifacts -maxdepth 1 -type f -name '*.zip.sha256' -print)"
          (cd artifacts && shasum -a 256 -c "$(basename "$sidecar")")
          python3 Tools/verify_build_provenance.py \
            --provenance "$provenance" \
            --artifact "$artifact" \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-source-sha "$GITHUB_SHA" \
            --module-id all \
            --expected-checkout clean \
            --expected-generated-copies 0 \
            --expected-workflow "Build 2 macOS" \
            --expected-event workflow_dispatch \
            --expected-workflow-source .github/workflows/build2-macos.yml \
            --require-macos-toolchain
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "provenance=$provenance" >> "$GITHUB_OUTPUT"
          echo "sidecar=$sidecar" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(awk '{print $1}' "${{ steps.package.outputs.sidecar }}")
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          MacGamingTrainer ${{ steps.version.outputs.version }}.

          Source: $GITHUB_SHA
          Bundle build: ${{ steps.version.outputs.build }}
          Included modules: ${{ steps.version.outputs.modules }}
          Primary artifact SHA-256: $digest

          Linux contracts, Build 2 macOS, and Module build matrix all completed successfully via explicit workflow_dispatch on this exact source SHA before publication. Actual-game acceptance for each included module remains separate from automated convergence and packaging verification.
          EOF
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.artifact }}" \
            "${{ steps.package.outputs.provenance }}" \
            "${{ steps.package.outputs.sidecar }}" \
            --target "$GITHUB_SHA" \
            --title "MacGamingTrainer ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
