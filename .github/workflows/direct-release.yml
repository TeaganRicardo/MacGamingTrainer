name: Direct release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Require exact checkout and release identity
        id: version
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)
          tag="v$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$build" =~ ^[1-9][0-9]*$ ]]
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists." >&2
            exit 1
          fi
          revision=$(python3 - <<'PY'
          import re
          from pathlib import Path
          from Tools.resident_runtime import DEFAULT_MODULE_RE

          source = Path("Backend/games/hades2/runtime/hades.lua").read_text(encoding="utf-8")
          match = re.search(DEFAULT_MODULE_RE, source)
          if match is None:
              raise SystemExit("resident runtime revision not found")
          print(match.group(1))
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "sha_short=${GITHUB_SHA:0:8}" >> "$GITHUB_OUTPUT"

      - name: Require successful convergence dispatches on exact SHA
        id: convergence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f event="workflow_dispatch" \
            -f per_page=100 \
            > "$RUNNER_TEMP/convergence-runs.json"
          python3 - "$RUNNER_TEMP/convergence-runs.json" "$GITHUB_SHA" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          path, sha, output_path = sys.argv[1:4]
          runs = json.load(open(path, encoding="utf-8")).get("workflow_runs", [])
          required = {"Linux contracts", "Build 2 macOS", "Module build matrix"}
          selected = {}
          for run in runs:
              if (
                  run.get("head_sha") != sha
                  or run.get("event") != "workflow_dispatch"
                  or run.get("conclusion") != "success"
                  or run.get("name") not in required
              ):
                  continue
              name = run["name"]
              if name not in selected or int(run.get("run_number") or 0) > int(selected[name].get("run_number") or 0):
                  selected[name] = run

          missing = sorted(required - selected.keys())
          if missing:
              raise SystemExit(
                  "Missing successful workflow_dispatch convergence run(s) for exact SHA "
                  + sha
                  + ": "
                  + ", ".join(missing)
              )

          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"build2_run_id={selected['Build 2 macOS']['id']}\n")

          for name in sorted(required):
              run = selected[name]
              print(f"{name}: {run.get('html_url')} ({run.get('head_sha')})")
          PY

      - name: Download exact convergence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_name="MacGamingTrainer-${{ steps.version.outputs.version }}-b${{ steps.version.outputs.build }}-${{ steps.version.outputs.sha_short }}-rc"
          mkdir -p artifacts
          gh run download "${{ steps.convergence.outputs.build2_run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$artifact_name" \
            --dir artifacts

      - name: Verify retained artifact provenance and checksum
        id: package
        run: |
          test "$(find artifacts -maxdepth 1 -type f -name '*.zip' -print | wc -l | tr -d ' ')" -eq 1
          test "$(find artifacts -maxdepth 1 -type f -name '*.provenance.json' -print | wc -l | tr -d ' ')" -eq 1
          test "$(find artifacts -maxdepth 1 -type f -name '*.zip.sha256' -print | wc -l | tr -d ' ')" -eq 1
          artifact="$(find artifacts -maxdepth 1 -type f -name '*.zip' -print)"
          provenance="$(find artifacts -maxdepth 1 -type f -name '*.provenance.json' -print)"
          sidecar="$(find artifacts -maxdepth 1 -type f -name '*.zip.sha256' -print)"
          (cd artifacts && shasum -a 256 -c "$(basename "$sidecar")")
          python3 - "$provenance" "$GITHUB_SHA" "${{ steps.version.outputs.version }}" "${{ steps.version.outputs.build }}" <<'PY'
          import json
          import sys

          path, sha, version, build = sys.argv[1:5]
          manifest = json.load(open(path, encoding="utf-8"))
          assert manifest["source"]["commit"] == sha, manifest["source"]
          assert manifest["productVersion"] == version, manifest.get("productVersion")
          assert str(manifest["bundleBuild"]) == build, manifest.get("bundleBuild")
          assert manifest["buildInputs"]["checkout"] == "clean", manifest["buildInputs"]
          assert manifest["moduleId"] == "hades2", manifest
          assert manifest["residentRuntime"]["sourceSha256"] == manifest["residentRuntime"]["packagedSha256"]
          PY
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "provenance=$provenance" >> "$GITHUB_OUTPUT"
          echo "sidecar=$sidecar" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(awk '{print $1}' "${{ steps.package.outputs.sidecar }}")
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          MacGamingTrainer ${{ steps.version.outputs.version }}.

          Source: $GITHUB_SHA
          Bundle build: ${{ steps.version.outputs.build }}
          Resident runtime revision: ${{ steps.version.outputs.revision }}
          Primary artifact SHA-256: $digest

          Linux contracts, Build 2 macOS, and Module build matrix all completed successfully via explicit workflow_dispatch on this exact source SHA before publication. Real-game acceptance of resident revision ${{ steps.version.outputs.revision }} remains separate from automated convergence and packaging verification.
          EOF
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.package.outputs.artifact }}" \
            "${{ steps.package.outputs.provenance }}" \
            "${{ steps.package.outputs.sidecar }}" \
            --target "$GITHUB_SHA" \
            --title "MacGamingTrainer ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
