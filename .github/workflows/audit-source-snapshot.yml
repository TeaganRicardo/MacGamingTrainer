name: Audit source snapshot

on:
  push:
    branches:
      - audit/pre-feature-deep-review-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile and validate backend
        run: |
          python3 -m compileall -q Backend
          python3 Tools/validate_game_module.py hades2

      - name: Run exhaustive Python contract suite on Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for test_file in tests/test_*.py; do
            echo "==> $test_file"
            python3 "$test_file"
            count=$((count + 1))
          done
          echo "audit_linux_test_count=$count"

      - name: Package exact source snapshot
        run: |
          tar             --exclude=.git             --exclude=dist             --exclude=.superpowers             -czf mgt-audit-source.tar.gz .
          sha256sum mgt-audit-source.tar.gz > mgt-audit-source.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mgt-audit-source
          path: |
            mgt-audit-source.tar.gz
            mgt-audit-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 2
