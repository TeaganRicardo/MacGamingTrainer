name: Audit source snapshot

on:
  push:
    branches:
      - audit/pre-feature-deep-review-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package exact source snapshot
        run: |
          tar \
            --exclude=.git \
            --exclude=dist \
            --exclude=.superpowers \
            -czf mgt-audit-source.tar.gz .
          sha256sum mgt-audit-source.tar.gz > mgt-audit-source.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: mgt-audit-source
          path: |
            mgt-audit-source.tar.gz
            mgt-audit-source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 2

      - name: Run supported Linux contract suite
        run: bash Tools/run_linux_checks.sh
