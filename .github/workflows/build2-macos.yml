# The workflow name is retained as a stable project/check identifier.
# "Build 2" is not a product-version source; product SemVer comes from Info.plist.
name: Build 2 macOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 Tools/ci_docs_only.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Docs-only fast path
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "Docs-only change; skipping macOS contracts/build/package."

      - name: Read product version
        id: version
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          source_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          source_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)
          [[ "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$source_version" = "$source_build"
          echo "version=$source_version" >> "$GITHUB_OUTPUT"
          source_sha="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          echo "sha_short=${source_sha:0:8}" >> "$GITHUB_OUTPUT"

      - name: Run full macOS contract suite
        if: steps.scope.outputs.docs_only != 'true'
        run: bash Tools/run_macos_checks.sh

      - name: Build Hades II trainer
        if: steps.scope.outputs.docs_only != 'true'
        run: ./build.sh hades2

      - name: Verify package
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          app="dist/Mac Gaming Trainer.app"
          expected="${{ steps.version.outputs.version }}"
          test -d "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")
          test "$version" = "$expected"
          test "$build" = "$expected"
          test -f "$app/Contents/Resources/Backend/games/hades2/module.json"
          count=$(find "$app/Contents/Resources/Backend/games" -name module.json | wc -l | tr -d ' ')
          test "$count" = "1"
          codesign --verify --deep --strict "$app"

      - name: Package release candidate
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          mkdir -p artifacts
          artifact="artifacts/MacGamingTrainer-${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha_short }}-rc.zip"
          ditto -c -k --sequesterRsrc --keepParent "dist/Mac Gaming Trainer.app" "$artifact"

      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          name: MacGamingTrainer-${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha_short }}-rc
          path: artifacts/MacGamingTrainer-${{ steps.version.outputs.version }}-${{ steps.version.outputs.sha_short }}-rc.zip
          if-no-files-found: error
          retention-days: 14
