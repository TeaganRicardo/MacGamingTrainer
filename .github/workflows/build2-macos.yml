# The workflow name is retained as a stable project/check identifier.
# "Build 2" is not a product-version source; release metadata comes from Info.plist.
name: Build 2 macOS

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single change-scope source for this lane. HEAD_SHA is the PR head (not the
  # merge ref), so every consumer sees exactly the proposed changes.
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_macos: ${{ steps.scope.outputs.needs_macos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Require intended scope checkout
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15.0'

      - name: Classify change scope
        id: scope
        run: python3 Tools/ci_docs_only.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Require explicit scope decision
        if: steps.scope.outputs.needs_macos != 'true' && steps.scope.outputs.needs_macos != 'false'
        run: |
          echo "Change-scope classifier did not emit needs_macos=true|false." >&2
          exit 1

  build:
    needs: scope
    if: ${{ always() }}
    runs-on: ${{ needs.scope.result == 'success' && needs.scope.outputs.needs_macos == 'true' && 'macos-26' || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      # macos-26 is GA but its hosted image is serviced in place. Exact image
      # identity and native tool versions are retained in artifact provenance.
      MGT_MACOS_RUNNER_LABEL: macos-26
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Require scope classification
        if: needs.scope.result != 'success'
        run: |
          echo "Change-scope classification failed; refusing to skip the macOS gate." >&2
          exit 1

      - name: Fast path
        if: needs.scope.result == 'success' && needs.scope.outputs.needs_macos == 'false'
        run: echo "Change does not require macOS platform checks/build/package."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.scope.outputs.needs_macos == 'true'
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Require intended executable checkout
        if: needs.scope.outputs.needs_macos == 'true'
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: needs.scope.outputs.needs_macos == 'true'
        with:
          python-version: '3.15.0'

      - name: Verify selected macOS toolchain
        if: needs.scope.outputs.needs_macos == 'true'
        run: python3 Tools/macos_toolchain_identity.py

      - name: Read release identity
        id: version
        if: needs.scope.outputs.needs_macos == 'true'
        run: |
          source_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          source_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$source_build" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          echo "version=$source_version" >> "$GITHUB_OUTPUT"
          echo "build=$source_build" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "sha_short=${source_sha:0:8}" >> "$GITHUB_OUTPUT"

      - name: Run macOS-only contract suite
        if: needs.scope.outputs.needs_macos == 'true'
        run: bash Tools/run_macos_checks.sh

      # Declared behavioural invariants, proven to fail when the code that
      # guards them is broken. Several of these tests compile Swift and drive
      # the real presentation and protocol paths, so this belongs in the
      # macOS lane rather than the portable one.
      - name: Build Lua 5.2 runtime test dependency
        if: needs.scope.outputs.needs_macos == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          archive="$RUNNER_TEMP/lua-5.2.4.tar.gz"
          lua_root="$RUNNER_TEMP/lua-5.2.4"
          curl -fsSL --retry 3 -o "$archive" https://www.lua.org/ftp/lua-5.2.4.tar.gz
          printf '%s  %s\n' b9e2e4aad6789b3b63a056d442f7b39f0ecfca3ae0f1fc0ae4e9614401b69f4b "$archive" | shasum -a 256 -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          make -C "$lua_root/src" generic
          test "$("$lua_root/src/lua" -e 'io.write(_VERSION)')" = 'Lua 5.2'
          echo "MGT_LUA52=$lua_root/src/lua" >> "$GITHUB_ENV"

      - name: Verify declared invariants fail under mutation
        if: needs.scope.outputs.needs_macos == 'true' && github.event_name == 'workflow_dispatch'
        run: python3 Tools/mutation_gate.py

      - name: Build unified trainer
        if: needs.scope.outputs.needs_macos == 'true'
        run: ./build.sh --all

      - name: Verify package
        if: needs.scope.outputs.needs_macos == 'true'
        run: |
          app="$(python3 Tools/verify_module_build.py all --print-app)"
          expected_version="${{ steps.version.outputs.version }}"
          expected_build="${{ steps.version.outputs.build }}"
          test -d "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")
          test "$version" = "$expected_version"
          test "$build" = "$expected_build"
          test -f "$app/Contents/Resources/Backend/games/hades2/module.json"
          test -f "$app/Contents/Resources/ui_terminology.json"
          test -f "$app/Contents/Resources/hades2.zh-CN.json"
          test -f "$app/Contents/Resources/hades2.en.json"
          test -f "$app/Contents/Resources/Backend/games/hades/module.json"
          codesign --verify --deep --strict "$app"

      - name: Package release candidate
        id: package
        if: needs.scope.outputs.needs_macos == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p artifacts
          app="$(python3 Tools/verify_module_build.py all --print-app)"
          artifact="artifacts/$(python3 Tools/write_build_provenance.py \
            --print-artifact-name \
            --product-version "${{ steps.version.outputs.version }}" \
            --bundle-build "${{ steps.version.outputs.build }}" \
            --repo-root "$GITHUB_WORKSPACE")"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$artifact"
          python3 Tools/write_build_provenance.py \
            --artifact "$artifact" \
            --product-version "${{ steps.version.outputs.version }}" \
            --bundle-build "${{ steps.version.outputs.build }}" \
            --repo-root "$GITHUB_WORKSPACE" \
            --module-id all \
            --workflow-source .github/workflows/build2-macos.yml

      - name: Verify release provenance and checksum
        if: needs.scope.outputs.needs_macos == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          provenance="artifacts/${{ steps.package.outputs.provenance_name }}"
          sidecar="${{ steps.package.outputs.sidecar_name }}"
          test -f "$provenance"
          test -f "artifacts/$sidecar"
          (cd artifacts && shasum -a 256 -c "$sidecar")
          python3 Tools/verify_build_provenance.py \
            --provenance "$provenance" \
            --artifact "artifacts/${{ steps.package.outputs.artifact_name }}" \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-source-sha "${{ steps.version.outputs.source_sha }}" \
            --module-id all \
            --expected-checkout clean \
            --expected-generated-copies 0 \
            --expected-workflow "Build 2 macOS" \
            --expected-event workflow_dispatch \
            --expected-workflow-source .github/workflows/build2-macos.yml \
            --require-macos-toolchain \
            --match-current-macos-toolchain

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: needs.scope.outputs.needs_macos == 'true' && github.event_name == 'workflow_dispatch'
        with:
          name: MacGamingTrainer-${{ steps.version.outputs.version }}-b${{ steps.version.outputs.build }}-${{ steps.version.outputs.sha_short }}-rc
          path: |
            artifacts/${{ steps.package.outputs.artifact_name }}
            artifacts/${{ steps.package.outputs.provenance_name }}
            artifacts/${{ steps.package.outputs.sidecar_name }}
          if-no-files-found: error
          retention-days: 14
