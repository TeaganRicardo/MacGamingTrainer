# The workflow name is retained as a stable project/check identifier.
# "Build 2" is not a product-version source; release metadata comes from Info.plist.
name: Build 2 macOS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 Tools/ci_docs_only.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Docs-only fast path
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "Docs-only change; skipping macOS platform checks/build/package."

      - name: Read release identity
        id: version
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          source_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          source_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$source_build" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          echo "version=$source_version" >> "$GITHUB_OUTPUT"
          echo "build=$source_build" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "sha_short=${source_sha:0:8}" >> "$GITHUB_OUTPUT"

      - name: Run macOS-only contract suite
        if: steps.scope.outputs.docs_only != 'true'
        run: bash Tools/run_macos_checks.sh

      - name: Build Hades II trainer
        if: steps.scope.outputs.docs_only != 'true'
        run: ./build.sh hades2

      - name: Verify package
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          app="dist/Mac Gaming Trainer.app"
          expected_version="${{ steps.version.outputs.version }}"
          expected_build="${{ steps.version.outputs.build }}"
          test -d "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")
          test "$version" = "$expected_version"
          test "$build" = "$expected_build"
          test -f "$app/Contents/Resources/Backend/games/hades2/module.json"
          count=$(find "$app/Contents/Resources/Backend/games" -name module.json | wc -l | tr -d ' ')
          test "$count" = "1"
          codesign --verify --deep --strict "$app"

      - name: Package release candidate
        id: package
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          mkdir -p artifacts
          artifact="artifacts/MacGamingTrainer-${{ steps.version.outputs.version }}-b${{ steps.version.outputs.build }}-${{ steps.version.outputs.sha_short }}-rc.zip"
          provenance="${artifact%.zip}.provenance.json"
          sidecar="${artifact}.sha256"
          ditto -c -k --sequesterRsrc --keepParent "dist/Mac Gaming Trainer.app" "$artifact"
          python3 Tools/write_build_provenance.py \
            --artifact "$artifact" \
            --product-version "${{ steps.version.outputs.version }}" \
            --bundle-build "${{ steps.version.outputs.build }}" \
            --repo-root "$GITHUB_WORKSPACE"
          test -f "$provenance"
          test -f "$sidecar"
          (cd artifacts && shasum -a 256 -c "$(basename "$sidecar")")
          python3 - "$provenance" "${{ steps.version.outputs.source_sha }}" "${{ steps.version.outputs.source_tree }}" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest["source"] == {
              "commit": sys.argv[2],
              "tree": sys.argv[3],
          }, manifest["source"]
          PY
          echo "artifact_name=$(basename "$artifact")" >> "$GITHUB_OUTPUT"
          echo "provenance_name=$(basename "$provenance")" >> "$GITHUB_OUTPUT"
          echo "sidecar_name=$(basename "$sidecar")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          name: MacGamingTrainer-${{ steps.version.outputs.version }}-b${{ steps.version.outputs.build }}-${{ steps.version.outputs.sha_short }}-rc
          path: |
            artifacts/${{ steps.package.outputs.artifact_name }}
            artifacts/${{ steps.package.outputs.provenance_name }}
            artifacts/${{ steps.package.outputs.sidecar_name }}
          if-no-files-found: error
          retention-days: 14
