name: Build 2 macOS
run-name: '#567 manual multi-context stall diagnostic'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multi-context-diagnostic:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MGT_DIAGNOSTIC_OUTPUT: ${{ github.workspace }}/diagnostic-output
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.15.0'
      - name: Record diagnostic source and platform
        run: |
          git rev-parse HEAD
          sw_vers
          xcodebuild -version
          python3 --version
      - name: Repeat existing native journey with request phases and stall sampling
        run: python3 -u Tools/diagnose_multi_game_contexts.py
      - name: Preserve bounded diagnostic output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: multi-context-stall-diagnostic
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 14
