# The workflow name is retained as a stable project/check identifier.
# "Build 2" is not a product-version source; release metadata comes from Info.plist.
name: Build 2 macOS

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single change-scope source for this lane. HEAD_SHA is the PR head (not the
  # merge ref), so every consumer sees exactly the proposed changes.
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_macos: ${{ steps.scope.outputs.needs_macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Assert executing source identity
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Classify change scope
        id: scope
        run: python3 Tools/ci_docs_only.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Require explicit scope decision
        if: steps.scope.outputs.needs_macos != 'true' && steps.scope.outputs.needs_macos != 'false'
        run: |
          echo "Change-scope classifier did not emit needs_macos=true|false." >&2
          exit 1

  build:
    needs: scope
    if: ${{ always() }}
    runs-on: ${{ needs.scope.result == 'success' && needs.scope.outputs.needs_macos == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15

    steps:
      - name: Require scope classification
        if: needs.scope.result != 'success'
        run: |
          echo "Change-scope classification failed; refusing to skip the macOS gate." >&2
          exit 1

      - name: Fast path
        if: needs.scope.result == 'success' && needs.scope.outputs.needs_macos == 'false'
        run: echo "Change does not require macOS platform checks/build/package."

      - uses: actions/checkout@v4
        if: needs.scope.outputs.needs_macos == 'true'
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Assert executing source identity
        if: needs.scope.outputs.needs_macos == 'true'
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Read release identity
        id: version
        if: needs.scope.outputs.needs_macos == 'true'
        run: |
          source_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          source_build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)
          source_sha="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          [[ "$source_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$source_build" =~ ^[1-9][0-9]*$ ]]
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]]
          echo "version=$source_version" >> "$GITHUB_OUTPUT"
          echo "build=$source_build" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "source_tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "sha_short=${source_sha:0:8}" >> "$GITHUB_OUTPUT"

      - name: Run macOS-only contract suite
        if: needs.scope.outputs.needs_macos == 'true'
        run: bash Tools/run_macos_checks.sh

      # Declared behavioural invariants, proven to fail when the code that
      # guards them is broken. Several of these tests compile Swift and drive
      # the real presentation and protocol paths, so this belongs in the
      # macOS lane rather than the portable one.
      - name: Verify declared invariants fail under mutation
        if: needs.scope.outputs.needs_macos == 'true'
        run: python3 Tools/mutation_gate.py

      - name: Build Hades II trainer
        if: needs.scope.outputs.needs_macos == 'true'
        run: ./build.sh hades2

      - name: Verify package
        if: needs.scope.outputs.needs_macos == 'true'
        run: |
          app="$(python3 Tools/verify_module_build.py hades2 --print-app)"
          expected_version="${{ steps.version.outputs.version }}"
          expected_build="${{ steps.version.outputs.build }}"
          test -d "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")
          test "$version" = "$expected_version"
          test "$build" = "$expected_build"
          test -f "$app/Contents/Resources/Backend/games/hades2/module.json"
          test -f "$app/Contents/Resources/ui_terminology.json"
          test -f "$app/Contents/Resources/hades2.zh-CN.json"
          test -f "$app/Contents/Resources/hades2.en.json"
          count=$(find "$app/Contents/Resources/Backend/games" -name module.json | wc -l | tr -d ' ')
          test "$count" = "1"
          codesign --verify --deep --strict "$app"

      - name: Package release candidate
        id: package
        if: needs.scope.outputs.needs_macos == 'true'
        run: >-
          python3 Tools/write_build_provenance.py --package hades2
          --repo-root "$GITHUB_WORKSPACE" --output-dir artifacts
          --github-output "$GITHUB_OUTPUT"

      - name: Verify artifact checksum
        if: needs.scope.outputs.needs_macos == 'true'
        env:
          ARTIFACT_SIDECAR: ${{ steps.package.outputs.sidecar }}
        run: (cd artifacts && shasum -a 256 -c "$(basename "$ARTIFACT_SIDECAR")")

      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.needs_macos == 'true'
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.provenance }}
            ${{ steps.package.outputs.sidecar }}
          if-no-files-found: error
          retention-days: 14
