name: Build 2 macOS

on:
  pull_request:
  # A manual run also runs the foreground-activation journeys.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required check. It always runs; a PR that changes only Markdown skips the work.
  build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # tests/macos_fixture_policy.py checks this against its hosted profile.
      MGT_MACOS_RUNNER_LABEL: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Decide what to run
        id: scope
        run: |
          # A pull_request checkout is the merge commit, so HEAD^1 is the base.
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # --no-renames: a rename must list its old path too (c.py -> c.md is a code change).
            changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
            grep -qv '\.md$' <<< "$changed" || { run=false; echo "Only Markdown changed; nothing to build."; }
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          # Compiled Swift test modules persist between runs through actions/cache.
          echo "MGT_SWIFT_TEST_CACHE_DIR=$RUNNER_TEMP/swift-test-cache" >> "$GITHUB_ENV"

      - name: Read declared Python version
        id: python-runtime
        if: steps.scope.outputs.run == 'true'
        run: python3 -c 'import json; print("version=" + json.load(open("Tools/python_runtime.json"))["version"])' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: ${{ steps.python-runtime.outputs.version }}

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.scope.outputs.run == 'true'
        with:
          path: |
            ${{ runner.temp }}/swift-test-cache
            ${{ runner.temp }}/ci-prerequisites
          key: macos-tests-${{ hashFiles('Sources/**', 'tests/swift_test_compiler.py', 'Tools/ci_prerequisites/*.sh') }}
          restore-keys: macos-tests-

      - name: Install Lua 5.2
        if: steps.scope.outputs.run == 'true'
        run: bash Tools/ci_prerequisites/lua52.sh

      - name: Build the App
        if: steps.scope.outputs.run == 'true'
        run: |
          ./build.sh --all
          app="$(python3 Tools/verify_module_build.py all --print-app)"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/MacGamingTrainer.zip"

      - name: Run macOS tests
        if: steps.scope.outputs.run == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            bash Tools/run_macos_checks.sh
          else
            bash Tools/run_macos_checks.sh --skip-foreground
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.scope.outputs.run == 'true'
        with:
          name: MacGamingTrainer-${{ github.sha }}
          path: ${{ runner.temp }}/MacGamingTrainer.zip
          retention-days: 14
