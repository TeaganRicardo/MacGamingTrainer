name: Full audit source snapshot

on:
  push:
    branches:
      - audit/full-review-20260921
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee258442f89a1e3ad4cb04f02bbfc7146488e148

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact main commit
        run: |
          test "$(git rev-parse HEAD)" = "ee258442f89a1e3ad4cb04f02bbfc7146488e148"
          printf '%s\n' "$(git rev-parse HEAD)" > "${RUNNER_TEMP}/mgt-full-audit.commit"

      - name: Package exact main source
        run: |
          archive="${RUNNER_TEMP}/mgt-full-audit-source.tar.gz"
          tar \
            --exclude=.git \
            --exclude=dist \
            --exclude=.superpowers \
            -czf "$archive" .
          sha256sum "$archive" > "${RUNNER_TEMP}/mgt-full-audit-source.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: mgt-full-audit-source
          path: |
            ${{ runner.temp }}/mgt-full-audit-source.tar.gz
            ${{ runner.temp }}/mgt-full-audit-source.tar.gz.sha256
            ${{ runner.temp }}/mgt-full-audit.commit
          if-no-files-found: error
          retention-days: 2

      - name: Run supported Linux contract suite
        run: bash Tools/run_linux_checks.sh
