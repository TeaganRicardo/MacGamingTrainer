name: Linux contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single change-scope source for this lane. HEAD_SHA is the PR head (not the
  # merge ref), so every consumer sees exactly the proposed changes.
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Require intended executable checkout
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Classify change scope
        id: scope
        run: python3 Tools/ci_docs_only.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Require explicit scope decision
        if: steps.scope.outputs.needs_linux != 'true' && steps.scope.outputs.needs_linux != 'false'
        run: |
          echo "Change-scope classifier did not emit needs_linux=true|false." >&2
          exit 1

      - name: Fast path
        if: steps.scope.outputs.needs_linux == 'false'
        run: echo "Change does not require Linux contract execution."

      - name: Check scoped Python lint, format and types
        if: steps.scope.outputs.needs_linux == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check -r Tools/python_static_requirements.txt
          python3 -m ruff check
          python3 -m ruff format --check
          python3 -m mypy

      - name: Install declared Linux CI prerequisites
        if: steps.scope.outputs.needs_linux == 'true'
        run: |
          prereqs="$(python3 Tools/discover_linux_tests.py --root "$PWD" --prerequisites)"
          for prereq in $prereqs; do
            bash "Tools/ci_prerequisites/${prereq}.sh"
          done

      - name: Enforce diff-based invariants
        if: steps.scope.outputs.needs_linux == 'true' && github.event_name == 'pull_request'
        run: python3 Tools/check_runtime_revision.py "$BASE_SHA" "$HEAD_SHA"

      - name: Run Linux contract checks
        if: steps.scope.outputs.needs_linux == 'true'
        run: bash Tools/run_linux_checks.sh
