name: Linux contracts

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single change-scope source for this lane. HEAD_SHA is the PR head (not the
  # merge ref), so every consumer sees exactly the proposed changes.
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify change scope
        id: scope
        run: python3 Tools/ci_docs_only.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Fast path
        if: steps.scope.outputs.needs_linux != 'true'
        run: echo "Change does not require Linux contract execution."

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.needs_linux == 'true'
        with:
          python-version: '3.12'

      - name: Enforce diff-based invariants
        if: steps.scope.outputs.needs_linux == 'true'
        run: python3 Tools/check_runtime_revision.py "$BASE_SHA" "$HEAD_SHA"

      - name: Run Linux contract checks
        if: steps.scope.outputs.needs_linux == 'true'
        run: bash Tools/run_linux_checks.sh
