name: Linux contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required check. It always runs; a PR that changes only Markdown skips the work.
  backend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Decide what to run
        id: scope
        run: |
          # A pull_request checkout is the merge commit, so HEAD^1 is the base.
          run=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # --no-renames: a rename must list its old path too (c.py -> c.md is a code change).
            changed="$(git diff --no-renames --name-only HEAD^1 HEAD)"
            grep -qv '\.md$' <<< "$changed" || { run=false; echo "Only Markdown changed; nothing to check."; }
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Read declared Python version
        id: python-runtime
        if: steps.scope.outputs.run == 'true'
        run: python3 -c 'import json; print("version=" + json.load(open("Tools/python_runtime.json"))["version"])' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: ${{ steps.python-runtime.outputs.version }}

      - name: Lint and type-check
        if: steps.scope.outputs.run == 'true'
        run: |
          python3 -m pip install --disable-pip-version-check -r Tools/python_static_requirements.txt
          python3 -m ruff check
          python3 -m ruff format --check
          python3 -m mypy

      - name: Install Lua 5.2
        if: steps.scope.outputs.run == 'true'
        run: bash Tools/ci_prerequisites/lua52.sh

      - name: Run portable tests
        if: steps.scope.outputs.run == 'true'
        run: bash Tools/run_linux_checks.sh
