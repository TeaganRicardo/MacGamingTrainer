name: Linux contracts

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 Tools/ci_docs_only.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Docs-only fast path
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "Docs-only change; skipping Linux contract suite."

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.docs_only != 'true'
        with:
          python-version: '3.12'

      - name: Enforce diff-based invariants
        if: steps.scope.outputs.docs_only != 'true'
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 Tools/check_runtime_revision.py "$BASE_SHA" "$HEAD_SHA"

      - name: Run Linux contract checks
        if: steps.scope.outputs.docs_only != 'true'
        run: bash Tools/run_linux_checks.sh
