name: Module build matrix

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single change-scope source for this lane. HEAD_SHA is the PR head (not the
  # merge ref), so every consumer sees exactly the proposed changes.
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        game:
          - reference_fixture
          - hades2

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: scope
        run: python3 Tools/ci_docs_only.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Docs-only fast path
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "Docs-only change; skipping module build for ${{ matrix.game }}."

      - name: Install reference fixture
        if: steps.scope.outputs.docs_only != 'true' && matrix.game == 'reference_fixture'
        run: |
          mkdir -p Backend/games/reference_fixture Sources/ReferenceFixture
          cp -R ContractFixtures/reference_module/backend/. Backend/games/reference_fixture/
          cp -R ContractFixtures/reference_module/frontend/. Sources/ReferenceFixture/

      - name: Build selected module
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          chmod +x build.sh Tools/*.py
          ./build.sh "${{ matrix.game }}"

      - name: Verify packaged module isolation
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          app="$(find dist -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$app"
          test -f "$app/Contents/Resources/Backend/games/${{ matrix.game }}/module.json"
          if [[ "${{ matrix.game }}" == "hades2" ]]; then
            test -f "$app/Contents/Resources/ui_terminology.json"
          else
            test ! -e "$app/Contents/Resources/ui_terminology.json"
          fi
          count="$(find "$app/Contents/Resources/Backend/games" -name module.json | wc -l | tr -d ' ')"
          test "$count" = "1"
          codesign --verify --deep --strict "$app"
