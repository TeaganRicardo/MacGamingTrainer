name: Module build matrix

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single change-scope source for this lane. HEAD_SHA is the PR head (not the
  # merge ref), so every consumer sees exactly the proposed changes. Manual
  # dispatch intentionally has no BASE_SHA; the scope classifier fails closed
  # and runs the full lane against the selected ref's exact github.sha.
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_module: ${{ steps.scope.outputs.needs_module }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Require intended scope checkout
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Classify change scope
        id: scope
        run: python3 Tools/ci_docs_only.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Require explicit scope decision
        if: steps.scope.outputs.needs_module != 'true' && steps.scope.outputs.needs_module != 'false'
        run: |
          echo "Change-scope classifier did not emit needs_module=true|false." >&2
          exit 1

  build:
    needs: scope
    if: ${{ always() }}
    runs-on: ${{ needs.scope.result == 'success' && needs.scope.outputs.needs_module == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        game:
          - reference_fixture

    steps:
      - name: Require scope classification
        if: needs.scope.result != 'success'
        run: |
          echo "Change-scope classification failed; refusing to skip the module gate." >&2
          exit 1

      - name: Fast path
        if: needs.scope.result == 'success' && needs.scope.outputs.needs_module == 'false'
        run: echo "Change does not require the reference module build."

      - uses: actions/checkout@v4
        if: needs.scope.outputs.needs_module == 'true'
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Require intended executable checkout
        if: needs.scope.outputs.needs_module == 'true'
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Install reference fixture
        if: needs.scope.outputs.needs_module == 'true'
        run: |
          mkdir -p Backend/games/reference_fixture Sources/ReferenceFixture
          cp -R ContractFixtures/reference_module/backend/. Backend/games/reference_fixture/
          cp -R ContractFixtures/reference_module/frontend/. Sources/ReferenceFixture/

      - name: Build selected module
        if: needs.scope.outputs.needs_module == 'true'
        run: |
          ./build.sh "${{ matrix.game }}"

      - name: Verify packaged module isolation
        if: needs.scope.outputs.needs_module == 'true'
        run: |
          app="$(python3 Tools/verify_module_build.py "${{ matrix.game }}" --print-app)"
          test -f "$app/Contents/Resources/Backend/games/${{ matrix.game }}/module.json"
          test ! -e "$app/Contents/Resources/ui_terminology.json"
          test ! -e "$app/Contents/Resources/hades2.zh-CN.json"
          test ! -e "$app/Contents/Resources/hades2.en.json"
          count="$(find "$app/Contents/Resources/Backend/games" -name module.json | wc -l | tr -d ' ')"
          test "$count" = "1"
          codesign --verify --deep --strict "$app"

      - name: Retain reference module artifact and source provenance
        id: package
        if: needs.scope.outputs.needs_module == 'true'
        run: |
          app="$(python3 Tools/verify_module_build.py "${{ matrix.game }}" --print-app)"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)
          mkdir -p artifacts
          artifact="artifacts/$(python3 Tools/write_build_provenance.py \
            --print-artifact-name --name-label "${{ matrix.game }}" \
            --product-version "$version" --bundle-build "$build" \
            --repo-root "$GITHUB_WORKSPACE")"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$artifact"
          python3 Tools/write_build_provenance.py \
            --artifact "$artifact" --product-version "$version" --bundle-build "$build" \
            --repo-root "$GITHUB_WORKSPACE" --module-id "${{ matrix.game }}" \
            --name-label "${{ matrix.game }}" \
            --generated-copy ContractFixtures/reference_module/backend:Backend/games/reference_fixture \
            --generated-copy ContractFixtures/reference_module/frontend:Sources/ReferenceFixture

      - name: Verify reference artifact checksum and declared inputs
        if: needs.scope.outputs.needs_module == 'true'
        run: |
          (cd artifacts && shasum -a 256 -c "${{ steps.package.outputs.sidecar_name }}")
          python3 - "artifacts/${{ steps.package.outputs.provenance_name }}" "$HEAD_SHA" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1], encoding='utf-8'))
          assert manifest['source']['commit'] == sys.argv[2]
          assert manifest['moduleId'] == 'reference_fixture'
          assert manifest['buildInputs']['checkout'] == 'declared-generated'
          assert len(manifest['buildInputs']['generatedCopies']) == 2
          PY

      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.needs_module == 'true'
        with:
          name: ${{ matrix.game }}-${{ env.HEAD_SHA }}
          path: |
            artifacts/${{ steps.package.outputs.artifact_name }}
            artifacts/${{ steps.package.outputs.provenance_name }}
            artifacts/${{ steps.package.outputs.sidecar_name }}
          if-no-files-found: error
          retention-days: 14
