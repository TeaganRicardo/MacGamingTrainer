name: Module build matrix

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single change-scope source for this lane. HEAD_SHA is the PR head (not the
  # merge ref), so every consumer sees exactly the proposed changes.
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_module: ${{ steps.scope.outputs.needs_module }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Assert executing source identity
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Classify change scope
        id: scope
        run: python3 Tools/ci_docs_only.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Require explicit scope decision
        if: steps.scope.outputs.needs_module != 'true' && steps.scope.outputs.needs_module != 'false'
        run: |
          echo "Change-scope classifier did not emit needs_module=true|false." >&2
          exit 1

  build:
    needs: scope
    if: ${{ always() }}
    runs-on: ${{ needs.scope.result == 'success' && needs.scope.outputs.needs_module == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        game:
          - reference_fixture

    steps:
      - name: Require scope classification
        if: needs.scope.result != 'success'
        run: |
          echo "Change-scope classification failed; refusing to skip the module gate." >&2
          exit 1

      - name: Fast path
        if: needs.scope.result == 'success' && needs.scope.outputs.needs_module == 'false'
        run: echo "Change does not require the reference module build."

      - uses: actions/checkout@v4
        if: needs.scope.outputs.needs_module == 'true'
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Assert executing source identity
        if: needs.scope.outputs.needs_module == 'true'
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Install reference fixture
        if: needs.scope.outputs.needs_module == 'true'
        run: |
          mkdir -p Backend/games/reference_fixture Sources/ReferenceFixture
          cp -R ContractFixtures/reference_module/backend/. Backend/games/reference_fixture/
          cp -R ContractFixtures/reference_module/frontend/. Sources/ReferenceFixture/

      - name: Build selected module
        if: needs.scope.outputs.needs_module == 'true'
        env:
          MGT_BUILD_DERIVED_INPUTS: >-
            {"Backend/games/reference_fixture":"ContractFixtures/reference_module/backend",
             "Sources/ReferenceFixture":"ContractFixtures/reference_module/frontend"}
        run: ./build.sh "${{ matrix.game }}"

      - name: Verify packaged module isolation
        if: needs.scope.outputs.needs_module == 'true'
        run: |
          app="$(python3 Tools/verify_module_build.py "${{ matrix.game }}" --print-app)"
          test -f "$app/Contents/Resources/Backend/games/${{ matrix.game }}/module.json"
          test ! -e "$app/Contents/Resources/ui_terminology.json"
          test ! -e "$app/Contents/Resources/hades2.zh-CN.json"
          test ! -e "$app/Contents/Resources/hades2.en.json"
          count="$(find "$app/Contents/Resources/Backend/games" -name module.json | wc -l | tr -d ' ')"
          test "$count" = "1"
          codesign --verify --deep --strict "$app"

      - name: Package selected module evidence
        id: package
        if: needs.scope.outputs.needs_module == 'true'
        run: >-
          python3 Tools/write_build_provenance.py --package "${{ matrix.game }}"
          --repo-root "$GITHUB_WORKSPACE" --output-dir artifacts
          --github-output "$GITHUB_OUTPUT"

      - name: Verify artifact checksum
        if: needs.scope.outputs.needs_module == 'true'
        env:
          ARTIFACT_SIDECAR: ${{ steps.package.outputs.sidecar }}
        run: (cd artifacts && shasum -a 256 -c "$(basename "$ARTIFACT_SIDECAR")")

      - uses: actions/upload-artifact@v4
        if: needs.scope.outputs.needs_module == 'true'
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.provenance }}
            ${{ steps.package.outputs.sidecar }}
          if-no-files-found: error
          retention-days: 14
