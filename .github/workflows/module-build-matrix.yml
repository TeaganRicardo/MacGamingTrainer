name: Module build matrix

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single change-scope source for this lane. HEAD_SHA is the PR head (not the
  # merge ref), so every consumer sees exactly the proposed changes.
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
  HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needs_module: ${{ steps.scope.outputs.needs_module }}
      needs_module_full_build: ${{ steps.scope.outputs.needs_module_full_build }}
      games: ${{ steps.matrix.outputs.games }}
      runner_label: ${{ steps.toolchain.outputs.runner_label }}
      developer_dir: ${{ steps.toolchain.outputs.developer_dir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Require intended scope checkout
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version

      - name: Resolve macOS toolchain profile
        id: toolchain
        run: python3 Tools/macos_toolchain_identity.py --print-github-output >> "$GITHUB_OUTPUT"

      - name: Derive isolated module build matrix
        id: matrix
        run: echo "games=$(python3 Tools/module_inventory.py --matrix-json --include reference_fixture)" >> "$GITHUB_OUTPUT"

      - name: Classify change scope
        id: scope
        run: python3 Tools/ci_docs_only.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Require explicit scope decision
        if: (steps.scope.outputs.needs_module != 'true' && steps.scope.outputs.needs_module != 'false') || (steps.scope.outputs.needs_module_full_build != 'true' && steps.scope.outputs.needs_module_full_build != 'false') || (steps.scope.outputs.needs_module_full_build == 'true' && steps.scope.outputs.needs_module != 'true')
        run: |
          echo "Change-scope classifier did not emit valid needs_module / needs_module_full_build outputs." >&2
          exit 1

  build:
    needs: scope
    if: ${{ always() }}
    runs-on: ${{ needs.scope.result == 'success' && needs.scope.outputs.needs_module == 'true' && (github.event_name == 'workflow_dispatch' || matrix.game == 'reference_fixture') && needs.scope.outputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      # Isolated declared product modules run on explicit convergence, while PRs
      # run only the reference fixture for shared module seams.
      MGT_RUN_MODULE_BUILD: ${{ needs.scope.result == 'success' && needs.scope.outputs.needs_module == 'true' && (github.event_name == 'workflow_dispatch' || matrix.game == 'reference_fixture') }}
      # Runner label and Xcode path come from Tools/macos_toolchain_identity.py
      # via the scope job.
      MGT_MACOS_RUNNER_LABEL: ${{ needs.scope.outputs.runner_label }}
      DEVELOPER_DIR: ${{ needs.scope.outputs.developer_dir }}
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.scope.outputs.games) }}

    steps:
      - name: Require scope classification
        if: needs.scope.result != 'success'
        run: |
          echo "Change-scope classification failed; refusing to skip the module gate." >&2
          exit 1

      - name: Fast path
        if: needs.scope.result == 'success' && env.MGT_RUN_MODULE_BUILD == 'false'
        run: echo "Change does not require the reference module build."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.MGT_RUN_MODULE_BUILD == 'true'
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Require intended executable checkout
        if: env.MGT_RUN_MODULE_BUILD == 'true'
        run: test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: env.MGT_RUN_MODULE_BUILD == 'true'
        with:
          python-version-file: .python-version

      - name: Verify selected macOS toolchain
        if: env.MGT_RUN_MODULE_BUILD == 'true'
        run: python3 Tools/macos_toolchain_identity.py

      - name: Install reference fixture
        if: env.MGT_RUN_MODULE_BUILD == 'true' && matrix.game == 'reference_fixture'
        run: |
          mkdir -p Backend/games/reference_fixture Sources/ReferenceFixture
          cp -R ContractFixtures/reference_module/backend/. Backend/games/reference_fixture/
          cp -R ContractFixtures/reference_module/frontend/. Sources/ReferenceFixture/

      - name: Typecheck isolated module on Swift-only Core PR
        if: env.MGT_RUN_MODULE_BUILD == 'true' && github.event_name == 'pull_request' && needs.scope.outputs.needs_module_full_build == 'false'
        run: |
          ./build.sh --typecheck "${{ matrix.game }}"

      - name: Build selected module
        if: env.MGT_RUN_MODULE_BUILD == 'true' && (github.event_name != 'pull_request' || needs.scope.outputs.needs_module_full_build == 'true')
        run: |
          ./build.sh "${{ matrix.game }}"

      - name: Verify packaged module isolation
        if: env.MGT_RUN_MODULE_BUILD == 'true' && (github.event_name != 'pull_request' || needs.scope.outputs.needs_module_full_build == 'true')
        run: |
          app="$(python3 Tools/verify_module_build.py "${{ matrix.game }}" --print-app)"
          test -f "$app/Contents/Resources/Backend/games/${{ matrix.game }}/module.json"
          count="$(find "$app/Contents/Resources/Backend/games" -name module.json | wc -l | tr -d ' ')"
          test "$count" = "1"
          codesign --verify --deep --strict "$app"

      - name: Retain isolated module artifact and source provenance
        id: package
        if: env.MGT_RUN_MODULE_BUILD == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          app="$(python3 Tools/verify_module_build.py "${{ matrix.game }}" --print-app)"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Info.plist)
          mkdir -p artifacts
          artifact="artifacts/$(python3 Tools/write_build_provenance.py \
            --print-artifact-name --name-label "${{ matrix.game }}" \
            --product-version "$version" --bundle-build "$build" \
            --repo-root "$GITHUB_WORKSPACE")"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$artifact"
          copy_args=()
          if [[ "${{ matrix.game }}" == "reference_fixture" ]]; then
            copy_args=(--generated-copy ContractFixtures/reference_module/backend:Backend/games/reference_fixture
                       --generated-copy ContractFixtures/reference_module/frontend:Sources/ReferenceFixture)
          fi
          python3 Tools/write_build_provenance.py \
            --artifact "$artifact" --product-version "$version" --bundle-build "$build" \
            --repo-root "$GITHUB_WORKSPACE" --module-id "${{ matrix.game }}" \
            --name-label "${{ matrix.game }}" \
            --workflow-source .github/workflows/module-build-matrix.yml "${copy_args[@]}"

      - name: Verify isolated artifact checksum and declared inputs
        if: env.MGT_RUN_MODULE_BUILD == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          (cd artifacts && shasum -a 256 -c "${{ steps.package.outputs.sidecar_name }}")
          checkout=clean
          copies=0
          if [[ "${{ matrix.game }}" == "reference_fixture" ]]; then
            checkout=declared-generated
            copies=2
          fi
          python3 Tools/verify_build_provenance.py \
            --provenance "artifacts/${{ steps.package.outputs.provenance_name }}" \
            --artifact "artifacts/${{ steps.package.outputs.artifact_name }}" \
            --repo-root "$GITHUB_WORKSPACE" \
            --expected-source-sha "$HEAD_SHA" \
            --module-id "${{ matrix.game }}" \
            --expected-checkout "$checkout" \
            --expected-generated-copies "$copies" \
            --expected-workflow "Module build matrix" \
            --expected-event workflow_dispatch \
            --expected-workflow-source .github/workflows/module-build-matrix.yml \
            --match-current-macos-toolchain

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.MGT_RUN_MODULE_BUILD == 'true' && github.event_name == 'workflow_dispatch'
        with:
          name: ${{ matrix.game }}-${{ env.HEAD_SHA }}
          path: |
            artifacts/${{ steps.package.outputs.artifact_name }}
            artifacts/${{ steps.package.outputs.provenance_name }}
            artifacts/${{ steps.package.outputs.sidecar_name }}
          if-no-files-found: error
          retention-days: 14
