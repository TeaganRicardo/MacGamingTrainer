[tool.ruff]
include = ["Backend/core/**/*.py", "Backend/core/**/*.pyi"]
# Backend scripts imported by LLDB/Hades workers execute under Xcode's Python
# 3.9, so keep the Ruff syntax target at py39 even though mypy requires >=3.10
# and CI workflows use the .python-version interpreter (see Tools/python_runtime.json).
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "preserve"

[tool.mypy]
files = [
    "Backend/core/save_resolution.py",
    "Backend/core/structured_save_edit.py",
    "Backend/games/hades/save_edit.py",
    "Backend/games/hades/save_provider.py",
    "Backend/games/hades2/save_edit.py",
    "Backend/games/hades2/save_provider.py",
]
follow_imports = "silent"
python_version = "3.10"
disallow_any_generics = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "core.structured_save_edit"
disallow_untyped_defs = true
warn_return_any = true
